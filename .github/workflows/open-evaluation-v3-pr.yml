name: Open requested evaluation v3 PR
on:
  push:
    branches: [evaluation-v3-release]
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open the prepared change against main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/evaluation-v3-pr.md?ref=$GITHUB_SHA" \
            --jq .content | base64 --decode > pr-body.md
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head evaluation-v3-release --base main --json number --jq length)" = 0 ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head evaluation-v3-release \
              --title "Adopt evaluation v3: paired search and repeated scale-up metrics" --body-file pr-body.md
          fi
