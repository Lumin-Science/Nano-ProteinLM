schema_version: 1
model: esmc-171m
expected_parameter_count: 142310464
seed: 43

# R22: retain 24 layers/width768/12heads, narrow every SwiGLU FFN to1536.
# Learning rate and weight decay use nano_protein.schedule.mup_hyperparameters.
learning_rate: 0.000326599
weight_decay: 0.0183712
betas: [0.9, 0.95]
gradient_clip_norm: 1.0
warmup_steps: 554

attention_backend: flash
gradient_checkpointing: false
compile: false
compile_mode: default
walltime_seconds: 3600
log_interval: 10
peak_bf16_tflops_per_gpu: 312.0
stages:
  - name: stage1
    context_length: 512
    micro_batch_size: 64
    gradient_accumulation: 1
    mixture: {uniref90: 0.36, mgnify: 0.11, omg_img: 0.54}

# Retained hybrid Muon optimizer from r01.
optimizer: muon

# Single data-presentation change: balance the same masked examples across ranks.
balance_batches_across_ranks: true

# Weight each sequence NLL by sqrt(masked-target count), normalized globally.
training_loss_reduction: sqrt_mask_count

# Compute/capacity ablation: default FFN hidden2048 ->1536.
ffn_hidden_dim: 1536

# R29: share input embedding and vocabulary projection; keep separate output bias.
tie_word_embeddings: true
