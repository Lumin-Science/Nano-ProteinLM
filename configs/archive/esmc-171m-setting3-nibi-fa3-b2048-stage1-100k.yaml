# Setting 3: R02 RoPE10k + batch balance + sqrt loss, from scratch.
# Eight H100s: 64 examples/GPU x 8 GPUs x 4 accumulation microsteps = 2048.
# Same group LR/WD, 1000-step warmup and 100k updates as the completed Fir recipe.
schema_version: 1
model: esmc_171m
expected_parameter_count: 170559856
seed: 20260824
optimizer: muon
muon_momentum: 0.95
muon_lr_scale: 0.8
muon_attention_lr_scale: 0.9
muon_ffn_lr_scale: 0.75
muon_weight_decay_scale: 0.75
muon_nesterov: true
muon_ns_steps: 5
muon_adjust_lr_fn: match_rms_adamw
learning_rate: 0.0005
weight_decay: 0.01
betas:
- 0.9
- 0.95
gradient_clip_norm: 1.0
warmup_steps: 1000
rotary_base: 10000.0
attention_backend: flash3
gradient_checkpointing: false
learned_residual_routing: true
transformer_norm: rmsnorm
depth_scaled_residual_init: true
compile: false
compile_mode: default
max_steps: 100000
schedule_steps: 100000
walltime_seconds: 86400
log_interval: 10
peak_bf16_tflops_per_gpu: 989.5
stages:
- name: stage1
  context_length: 512
  micro_batch_size: 64
  gradient_accumulation: 4
  mixture:
    uniref90: 0.36
    mgnify: 0.11
    omg_img: 0.54
ffn_hidden_dim: 2048
tie_word_embeddings: false
balance_batches_across_ranks: true
training_loss_reduction: sqrt_mask_count
expected_world_size: 8
checkpoint_interval: 10000
periodic_evaluation_interval: 10000
periodic_evaluation_command:
- bash
- /scratch/muchenli/Nano-Protein-LM-nibi-setting3-b2048-100k-eval10k-20260908-run/reports/nibi-setting3-b2048-100k-eval10k-20260908/evaluate-checkpoint.sh
