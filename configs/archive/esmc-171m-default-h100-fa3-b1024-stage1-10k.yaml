# Default batch-1024 Stage-1 10k-step pilot for Fir H100.
# Four H100s: 64 sequences/GPU/microstep * 4 accumulation steps * 4 GPUs.
# Peak LR and warmup are explicit user settings (5e-4 and 1,000 steps).
# Base weight decay is the user-selected 0.01, informed by related protein
# pretraining recipes; ESMC's calibrated numerical base remains undisclosed.
# This is a project default, not an exact reproduction of the paper recipe.
schema_version: 1
model: esmc-171m
expected_parameter_count: 170671168
seed: 20260824
optimizer: adamw
learning_rate: 0.0005
weight_decay: 0.01
betas: [0.9, 0.95]
gradient_clip_norm: 1.0
warmup_steps: 1000
attention_backend: flash3
gradient_checkpointing: false
compile: false
compile_mode: default
max_steps: 10000
schedule_steps: 10000
# Four-hour emergency guard; the scientific budget is 10,000 optimizer steps.
walltime_seconds: 14400
log_interval: 10
peak_bf16_tflops_per_gpu: 989.5
stages:
  - name: stage1
    context_length: 512
    micro_batch_size: 64
    gradient_accumulation: 4
    mixture: {uniref90: 0.36, mgnify: 0.11, omg_img: 0.54}
