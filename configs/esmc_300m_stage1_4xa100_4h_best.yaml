schema_version: 1
model: esmc_300m
expected_parameter_count: 332823484
seed: 20260821

# Current P@L-selected setting: learned residual/input routing, parameter-free
# transformer RMSNorm, depth-scaled residual-output initialization, and a
# final-20% linear learning-rate cooldown. The original ESMC-compatible
# production setting remains in esmc_300m_stage1_4xa100_4h.yaml.
# Four-A100 smoke f19f801 measured 0.652124781901 s/step.
# ceil(1.02 * 14400 / rate) = 22,524; warmup is 10%.
learning_rate: 0.000233695
weight_decay: 0.025675
betas: [0.9, 0.95]
gradient_clip_norm: 1.0
minimum_lr_ratio: 0.1
max_steps: 22524
warmup_steps: 2253
stage1_cooldown_fraction: 0.2

attention_backend: flash
gradient_checkpointing: false
learned_residual_routing: true
transformer_norm: rmsnorm
depth_scaled_residual_init: true
compile: false
compile_mode: default
walltime_seconds: 14400
log_interval: 25
peak_bf16_tflops_per_gpu: 312.0
stages:
  - name: stage1
    context_length: 512
    micro_batch_size: 64
    gradient_accumulation: 1
    mixture: {uniref90: 0.36, mgnify: 0.11, omg_img: 0.54}

evaluation:
  checkpoints: [checkpoint-final.pt]
  profile: full
  pcore_tasks: all_six
  pcore_bootstrap: 10000
  pcore_task_parallel: 6
  pcore_probe_threads: 4
  pcore_batch_residues: 32768
  contact_chains: 20775
  contact_bootstrap: 5000
  contact_shards: 32

paper_reference:
  stage1_steps: 1000000
  stage1_context: 512
  stage1_global_sequences: 8192
  approximate_global_tokens: 4200000
  warmup_steps: 1000
