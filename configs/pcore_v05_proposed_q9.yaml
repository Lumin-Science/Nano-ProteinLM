schema_version: 1
protocol_id: pcore-v0.5-proposed-q9
status: proposed_unqualified
purpose: reliable selection of frozen protein-sequence embedding models

encoder_contract:
  layer: final_before_lm_head
  remove_special_and_padding_tokens: true
  global_pooling: valid_residue_mean
  long_sequence_policy: deterministic_common_windows
  model_finetuning: forbidden
  learned_pooling: forbidden
  per_model_layer_search: forbidden
  allowed_readouts:
    - standardized_logistic
    - standardized_ridge
    - frozen_cosine_knn

selection_tasks:
  - id: remote_homology
    axis: evolution
    dataset: tape_remote_homology_fold_holdout
    features: mean_embedding
    readout: standardized_multinomial_logistic
    primary_metric: balanced_accuracy
    null: chance_or_frozen_majority_baseline
    bootstrap_unit: scop_evolutionary_group

  - id: secondary_structure
    axis: local_structure
    dataset: tape_netsurfp2_cb513_primary
    features: residue_embedding
    readout: standardized_multinomial_logistic
    primary_metric: residue_macro_f1
    secondary_metrics: [q3_accuracy]
    null: frozen_residue_class_baseline
    bootstrap_unit: protein

  - id: cath44_remote_retrieval
    axis: global_structure
    dataset: cath_v4.4_experimental_pdb_domains_s20
    features: l2_normalized_mean_embedding
    readout: cosine_retrieval
    primary_metric: h_level_map
    secondary_metrics: [h_recall_at_1, topology_recall_at_1]
    null: frozen_superfamily_frequency_ranking
    bootstrap_unit: cath_h_superfamily

  - id: deeploc2
    axis: localization
    dataset: official_deeploc2_five_homology_partitions
    features: mean_embedding
    readout: standardized_one_vs_rest_logistic
    primary_metric: macro_auprc
    null: per_label_prevalence
    bootstrap_unit: protein_or_homology_cluster

  - id: cafa5_mf_nk30_hard
    axis: molecular_function
    dataset: cafa5_molecular_function_no_knowledge_max30_identity
    features: l2_normalized_mean_embedding
    readout: frozen_cosine_knn
    secondary_readout: sparse_one_vs_rest_linear
    primary_metric: weighted_fmax
    secondary_metrics: [protein_average_precision]
    null: frozen_go_mf_term_frequency
    bootstrap_unit: protein_then_species

  - id: pring_human_c3_30
    axis: interaction
    dataset: pring_human_node_disjoint_max30_identity
    features: symmetric_abs_difference_and_product
    readout: standardized_binary_logistic
    primary_metric: auprc
    secondary_metrics: [partner_recall_at_50]
    null: prevalence_degree_and_identity_controls
    bootstrap_unit: heldout_protein_or_community
    negative_seed_count_exact: 10

  - id: flip2_shift
    axis: fitness
    dataset: flip2_official_engineering_shift_panel
    features: mean_mutant_embedding
    readout: standardized_ridge
    primary_metric: hierarchical_spearman_ndcg
    null: train_mean_mutation_count_and_substitution_controls
    bootstrap_unit: dataset_then_landscape_then_group

  - id: megascale_family30_ddg
    axis: stability
    dataset: megascale_parent_and_max30_cluster_holdout
    features: mean_mutant_minus_mean_wildtype
    readout: standardized_ridge
    primary_metric: median_parent_spearman
    secondary_metrics: [pooled_spearman, rmse]
    null: train_mean_mutation_count_and_substitution_controls
    bootstrap_unit: parent_or_family

  - id: caid3_disorder_pdb
    axis: disorder
    dataset: caid3_disorder_pdb_temporal
    features: residue_embedding
    readout: standardized_binary_logistic
    primary_metric: average_precision
    secondary_metrics: [mcc]
    null: test_positive_prevalence
    bootstrap_unit: protein

aggregation:
  one_vote_per_selection_task: true
  task_normalization:
    bounded_higher_is_better: (metric-null)/(1-null)
    correlation: metric
    lower_is_better: 1-(metric/null_metric)
  primary_summary: median_normalized_gain_percentage_points
  weakness_summary: lower_quartile_normalized_gain_percentage_points
  raw_task_vector_required: true
  task_at_or_below_null_invalidates_promotion: true
  historical_geometric_mean: report_only

comparison_rule:
  minimum_median_gain_improvement_points: 1.0
  paired_median_interval_lower_bound_must_exceed_zero: true
  lower_quartile_may_not_regress: true
  maximum_material_task_regression_points: 5.0
  contact_is_separate_no_regression_axis: true
  fallback: retain_reference

uncertainty:
  exact_bootstrap_replicates: 10000
  paired_resample_ids_across_models: true
  biological_hierarchical_units_required: true

population_contract:
  common_fixed_rows_across_models: true
  model_specific_test_deletion: forbidden
  exposure_strata:
    - exact_match
    - identity_at_least_50pct
    - identity_at_least_30pct
    - post_model_cutoff
  common_unexposed_intersection_is_secondary: true

separate_axes:
  - long_range_contact_precision_at_l

quarantined_diagnostics:
  - enzyme_commission_current
  - peer_human_ppi_current_237_pair_reconstruction

release_only_candidates:
  - pring_cross_species
  - proteingym_few_shot
  - caid3_binding_idr
  - asep_epitope
  - biolip2_temporal_binding_site
  - scope_retrieval
  - deeploc2_1_membrane_type

