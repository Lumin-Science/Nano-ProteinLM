# AutoResearch reference: plain ESMC 171M with AdamW, the starting recipe for search.
# Backbone: paper 170M scaling architecture, Appendix A.1.4.1, Table S4
# (24 layers, width 768, 12 attention heads).
# https://www.biorxiv.org/content/10.64898/2026.06.03.729735v1.full.pdf#page=29
# Search setting: global batch 256 (64 x 1 accumulation x 4 GPUs), 500 warmup steps, then constant LR.
# The task command sets the training time, seed and attention backend.
schema_version: 1
model: esmc-171m
expected_parameter_count: 170671168
seed: 20260824
optimizer: adamw
learning_rate: 0.0005
weight_decay: 0.01
betas: [0.9, 0.95]
gradient_clip_norm: 1.0
warmup_steps: 500

attention_backend: flash3
gradient_checkpointing: false
compile: false
compile_mode: default
log_interval: 10
peak_bf16_tflops_per_gpu: 989.5
stages:
  - name: stage1
    context_length: 512
    micro_batch_size: 64
    gradient_accumulation: 1
    mixture: {uniref90: 0.36, mgnify: 0.11, omg_img: 0.54}
