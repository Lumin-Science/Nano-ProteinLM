# nanop-best-171m-round2: round 1 plus separate Q/K/V Muon updates.
# Backbone: paper 170M scaling architecture, Appendix A.1.4.1, Table S4.
# Search setting: global batch 256 (64 x 1 accumulation x 4 GPUs), 500 warmup steps, then constant LR.
# The task command sets the training time, seed and attention backend.
schema_version: 1
model: esmc_171m
expected_parameter_count: 170559856
seed: 20260824
optimizer: muon
muon_momentum: 0.95
muon_lr_scale: 0.8
muon_attention_lr_scale: 0.9
muon_ffn_lr_scale: 0.75
muon_weight_decay_scale: 0.75
muon_nesterov: true
muon_ns_steps: 5
muon_adjust_lr_fn: match_rms_adamw
muon_split_qkv: true
learning_rate: 0.0005
weight_decay: 0.01
betas:
- 0.9
- 0.95
gradient_clip_norm: 1.0
warmup_steps: 500
rotary_base: 10000.0
attention_backend: flash3
gradient_checkpointing: false
learned_residual_routing: true
transformer_norm: rmsnorm
depth_scaled_residual_init: true
compile: false
compile_mode: default
prefetch_batches: 2
log_interval: 10
peak_bf16_tflops_per_gpu: 989.5
stages:
- name: stage1
  context_length: 512
  micro_batch_size: 64
  gradient_accumulation: 1
  mixture:
    uniref90: 0.36
    mgnify: 0.11
    omg_img: 0.54
ffn_hidden_dim: 2048
tie_word_embeddings: false
balance_batches_across_ranks: true
training_loss_reduction: sqrt_mask_count
