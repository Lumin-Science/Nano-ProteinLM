# Illustrative mapping of the pinned OpenMM task; does not modify or configure that repository.
schema_version: '1.0'
task:
  id: openmm-nonbonded-example-v1
  title: Accelerate neighbor finding and direct-space nonbonded computation
  repository: https://github.com/Lumin-Science/LuminBench-OpenMM-Acceleration
  source_commit: 67b2c0f45758d0a6c85b2cfea97876176c199f94
  contract_status: example
question: Can a replacement for neighbor finding and direct-space nonbonded computation improve
  module and full-simulation throughput at fixed physical inputs and accuracy, while PME remains
  original OpenMM?
established:
  baseline: Original OpenMM 8.6.0, submodule c6173db6e8edd705eb59172bd21e9ce69c572405; stock-forwarding
    candidate is a control. Score reference remains original after each accepted change.
  capabilities:
  - Fixed module API and bridge with separate task GPU-event and end-to-end timing.
  - Frozen fixture preparation, calibrated force/energy/repeat envelopes and NVE canaries.
  - Current matched-steps-v1 evaluator with paired timings, bootstrap intervals, source/build/fixture
    receipts and seven-system final suite.
  limitations:
  - The forwarding baseline is not an optimized algorithm; a correctness/timing pass does not
    establish long ensemble equivalence.
  - Current programs require repeat evidence against incumbent but do not specify a numeric incumbent
    threshold.
  - Changing protected task programs requires a fresh matching baseline; old baseline hashes cannot
    be amended.
research:
  score:
    name: task_speedup
    direction: maximize
    unit: ratio to original OpenMM; 1 means equal speed
    definition: For each system take median(original_task_us_per_step / candidate_task_us_per_step)
      over paired samples; take the geometric mean of the three system speedups. Correctness failure
      gives no score.
    artifact: result.json:score.reward
    aggregation: Median of at least N paired process ratios per system, then geometric mean over
      DHFR, ApoA1 and water-30000. Do not average raw times across differently sized systems.
  repeats:
    unit: paired_process_timing
    count: 5
    identities:
    - pair-1
    - pair-2
    - pair-3
    - pair-4
    - pair-5
    matching: Per system, pair original and candidate fresh-process samples and alternate their
      order. All pairs use the same frozen fixtures, scientific seed and measured moving-step
      count. Confirm a promising build in a fresh evaluation bundle.
    uncertainty: 'Paired bootstrap: 4000 resamples, seed 20260906; median of ratios within system
      and geometric mean across systems in each bootstrap. Report 95% interval, medians, MAD and
      raw pairs. These are process repeats, not five training seeds.'
  budget:
    kind: fixed_work
    amount: Per-system timing_steps from the validated matched-steps-v1 baseline manifest
    unit: moving simulation steps per timing sample
    meter: Original-release calibration targets 2 seconds per system; CUDA steps rounded upward
      to a multiple of 1000. Freeze the count for every variant and future candidate. Warmup is
      1000 CUDA steps, sync blocks 100 steps. Initialization, build and warmup are recorded outside
      timing.
    completion: Correctness passes on every system before timing any system. Complete all frozen
      steps and at least five paired samples for all required systems; recurring work, data movement
      and synchronization remain measured.
  hardware:
    description: 1 x NVIDIA L40S; CUDA mixed precision, fixed scientific accuracy envelopes
    resources:
      gpu_model: NVIDIA L40S
      gpu_count: 1
      precision: CUDA mixed precision, fixed scientific accuracy envelopes
  evaluation:
    entrypoint: python -m evaluate.run --task nonbonded --suite iteration
    settings:
      timing_policy: matched-steps-v1
      iteration_systems:
      - dhfr
      - apoa1
      - water-30000
      samples: 5
      bootstrap_replicates: 4000
      bootstrap_seed: 20260906
      scientific_seed: 20260906
      ensemble: NVT
      temperature_k: 300
      timestep_fs: 2
      cutoff_nm: 0.9
      ewald_tolerance: 0.0005
      constraints: HBonds / rigid water
      snapshot_repeats: 20
      transition_steps: 500
      nve_canary_ps: 20
      correctness_envelopes: Fixture-specific frozen stock calibration; 10x observed repeat differences
        with precision-scale rounding floors. Do not invent or relax numerical thresholds.
  validity_gates:
  - Baseline status=baseline_validated with current protected source hashes and timing_policy=matched-steps-v1.
  - All snapshot, moving configuration, force/energy, repeat stability and applicable NVE gates
    pass before timing.
  - Native CUDA tests, independent reference fixtures and Python checks pass; build/source identities
    match.
  - Candidate status=evaluated, all required paired samples present, finite positive timing values,
    complete immutable result bundle.
  promotion:
    reference: Original OpenMM for normalized score; current accepted implementation for promotion.
    rule: 'Existing task: evaluator finding=faster (95% aggregate interval lower bound >1), changed
      implementation, and repeat evidence supports improvement over current best. Reconfirm and
      inspect per-system/end-to-end regressions. Numeric incumbent threshold is unspecified in
      the source; this example does not authorize automatic promotion.'
  diagnostics:
  - Per-system task speedups and confidence intervals
  - Per-system end-to-end speedups and ns/day
  - Setup/build cost, raw paired samples, medians/MAD, baseline drift and correctness errors
boundaries:
  default_policy: protected
  protected_paths_take_precedence: true
  editable_paths:
  - src/nonbonded/**
  protected_paths:
  - src/api/**
  - src/bridge/**
  - src/openmm/**
  - src/pme/**
  - evaluate/**
  - tools/**
  - tasks/**
  - program.md
  - README.md
  - pyproject.toml
  - .gitmodules
  - src/CMakeLists.txt
  - results/baselines/**
  artifact_paths:
  - results/autoresearch/nonbonded/<campaign-id>/**
  - results/runs/nonbonded/<unique-run-id>/**
  - .cache/autoresearch/nonbonded/<campaign-id>/**
  editable_config_keys: []
  frozen_config_keys:
  - All scientific settings and accuracy envelopes in evaluate/config.py and resolved fixture
    manifests
  - Fixture payloads, timing policy, step counts, repeat count and bootstrap rules
  - Reference build, OpenMM revision, bridge/API and partner module
  rules:
  - Only the selected src/nonbonded/ implementation may change. New algorithms and private data
    structures are allowed; API outputs and correction-term ownership stay fixed.
  - PME remains original OpenMM. Exceptions, self/background and dispersion terms, other forces,
    integrator, constraints and atom reordering remain bridge-owned.
  - All recurring preparation/compute, neighbor maintenance when applicable, synchronization and
    data movement count. Secondary queues must join the assigned queue before completion.
  - No benchmark-name/hash/seed specialization, precomputed answers, altered physical settings
    or moving repeated work outside measured callbacks.
  - Use isolated worktree, one experiment per GPU, fresh build/output directories and append-only
    records; preserve failures and original baseline artifacts.
test:
  budget:
    kind: fixed_work
    amount: Per-system timing_steps from the validated matched-steps-v1 baseline manifest
    unit: moving simulation steps per timing sample
    meter: Original-release calibration targets 2 seconds per system; CUDA steps rounded upward
      to a multiple of 1000. Freeze the count for every variant and future candidate. Warmup is
      1000 CUDA steps, sync blocks 100 steps. Initialization, build and warmup are recorded outside
      timing.
    completion: Correctness passes on every system before timing any system. Complete all frozen
      steps and at least five paired samples for all required systems; recurring work, data movement
      and synchronization remain measured.
  hardware:
    description: 1 x NVIDIA L40S; CUDA mixed precision, fixed scientific accuracy envelopes
    resources:
      gpu_model: NVIDIA L40S
      gpu_count: 1
      precision: CUDA mixed precision, fixed scientific accuracy envelopes
  repeats:
    unit: paired_process_timing
    count: 5
    identities:
    - pair-1
    - pair-2
    - pair-3
    - pair-4
    - pair-5
    matching: Per system, pair original and candidate fresh-process samples and alternate their
      order. All pairs use the same frozen fixtures, scientific seed and measured moving-step
      count. Confirm a promising build in a fresh evaluation bundle.
    uncertainty: 'Paired bootstrap: 4000 resamples, seed 20260906; median of ratios within system
      and geometric mean across systems in each bootstrap. Report 95% interval, medians, MAD and
      raw pairs. These are process repeats, not five training seeds.'
  evaluation:
    entrypoint: python -m evaluate.run --task nonbonded --suite final
    settings:
      timing_policy: matched-steps-v1
      iteration_systems:
      - dhfr
      - apoa1
      - water-30000
      samples: 5
      bootstrap_replicates: 4000
      bootstrap_seed: 20260906
      scientific_seed: 20260906
      ensemble: NVT
      temperature_k: 300
      timestep_fs: 2
      cutoff_nm: 0.9
      ewald_tolerance: 0.0005
      constraints: HBonds / rigid water
      snapshot_repeats: 20
      transition_steps: 500
      nve_canary_ps: 20
      correctness_envelopes: Fixture-specific frozen stock calibration; 10x observed repeat differences
        with precision-scale rounding floors. Do not invent or relax numerical thresholds.
      final_systems:
      - dhfr
      - apoa1
      - cellulose
      - stmv
      - water-3000
      - water-30000
      - water-300000
      baseline: Separate validated final-suite baseline covering every system, same protected
        contract.
  metrics:
  - name: end_to_end_speedup
    direction: maximize
    unit: ratio to unmodified OpenMM release
    definition: Full moving simulation step time includes integration overhead and the unchanged
      partner.
    artifact: result.json:final_end_to_end_geomean; comparisons.<system>.integration.speedup
    aggregation: Per-system median of paired speedup ratios; equal-system geometric mean across
      all seven final systems.
  - name: simulation_throughput
    direction: maximize
    unit: ns/day
    definition: Simulated physical nanoseconds per day of computation for each system.
    artifact: result.json:comparisons.<system>.ns_per_day
    aggregation: Median of measured throughput samples per system; no aggregate of absolute ns/day
      across different systems.
  - name: task_speedup
    direction: maximize
    unit: ratio to original OpenMM; 1 means equal speed
    definition: For each system take median(original_task_us_per_step / candidate_task_us_per_step)
      over paired samples; take the geometric mean of the three system speedups. Correctness failure
      gives no score.
    artifact: result.json:score.reward
    aggregation: Median of at least N paired process ratios per system, then geometric mean over
      DHFR, ApoA1 and water-30000. Do not average raw times across differently sized systems.
  success_rule: Existing source requires complete correctness-qualified final reporting with task/full-simulation
    speedups and ns/day. It does not define a final all-system regression tolerance or aggregate
    pass threshold. Report per-system changes and intervals; do not invent a binary success claim.
  comparison_references:
  - Unmodified OpenMM release for end-to-end speed and ns/day
  - Original module through the fixed bridge for task speed
  selection_policy: Freeze the best source/build before final evaluation. Additional final systems
    do not enter the three-system research score or ordinary promotion decision.
  evaluation_overlap: Final suite contains all three search systems plus cellulose, STMV, water-3000
    and water-300000; a broader suite, not wholly unseen evaluation.
  transfer:
    other_module: original OpenMM PME
    measured_work: Frozen per-system simulation steps, no training or token budget
    research_score_on_final_run: score.reward still uses only DHFR, ApoA1 and water-30000; final_end_to_end_geomean
      uses every final system.
  validity_gates:
  - Validated baseline covers every final-suite system and matches the same protected source/fixture/timing
    contract.
  - All required correctness gates pass on every final system before timing.
  - At least five paired samples use the frozen per-system step counts; all task and end-to-end
    timings are finite and positive.
  - The frozen candidate source matches the built artifact; final result status=evaluated and
    complete per-system records are present.
implementation:
  research_status: existing_runner
  test_status: existing_runner
  boundary_status: Source/build/fixture hashes and correctness/timing gates enforced by the existing
    OpenMM evaluator; these example YAMLs are not loaded by it.
  gaps:
  - Predeclare a numerical incumbent-promotion rule before enabling fully automatic keep decisions;
    source program leaves this as repeat-evidence review.
  - Predeclare a final success/regression policy if the new task requires a binary test outcome;
    existing final suite is reporting only.
  - A campaign needs concrete calibrated baseline/fixture hashes and per-system timing_steps;
    never replace these with guessed constants.
provenance:
- tasks/program_non_bonded.md
- evaluate/README.md
- evaluate/config.py
- evaluate/timing.py
- evaluate/run.py
- evaluate/reward.py
- src/api/README.md
